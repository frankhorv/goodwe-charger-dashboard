name: goodwe-web / build
run-name: ${{ github.workflow }} @ ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "src/**"
      - "static/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build.yaml"

jobs:
  build:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # Self-signed certificate — shows publisher name but still triggers SmartScreen.
      # Secrets: SIGNING_CERT_BASE64 (PFX as base64), SIGNING_CERT_PASSWORD
      - name: Sign binary
        shell: pwsh
        env:
          PFX_BASE64:   ${{ secrets.SIGNING_CERT_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes('cert.pfx', $bytes)

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          & $signtool sign `
            /f cert.pfx /p $env:PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            target\release\goodwe-web.exe

          Remove-Item cert.pfx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: goodwe-web-windows-x86_64
          path: target/release/goodwe-web.exe
          if-no-files-found: error

  # ── Create GitHub release when a version tag is pushed ─────────────────────
  release:
    name: Create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: goodwe-web-windows-x86_64
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/goodwe-web.exe
